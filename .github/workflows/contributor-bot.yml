name: Open Design Contributor Bot

on:
  pull_request:
    types: [closed]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: contributor-bot-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  recognize:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issues' && github.event.action == 'opened')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contributor bot
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: pnpm exec tsx scripts/action-handler.ts
